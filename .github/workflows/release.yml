name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify launcher package
        shell: powershell
        run: ./tests/verify.ps1
      - name: Build release archive
        shell: powershell
        run: |
          $items = @(
            "assets", "scripts", "config.json", "install.bat", "stop.bat",
            "uninstall.bat", "README.md", "README.zh.md", "LICENSE", "package.json"
          )
          Compress-Archive -Path $items -DestinationPath "deepseek-harness-launcher-${{ github.ref_name }}.zip"
      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "deepseek-harness-launcher-${{ github.ref_name }}.zip" --generate-notes --verify-tag
